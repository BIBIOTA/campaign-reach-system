[versions]
# JVM toolchain
java = "21"

# Spring Boot 3 (BOM-managed transitive versions)
springBoot = "3.4.1"
springDependencyManagement = "1.1.7"

# Architecture guard
archunit = "1.3.0"

# PostgreSQL JDBC driver (runtime only; aligned with Spring Boot 3.4 BOM)
postgresql = "42.7.4"

# Test
junit = "5.11.4"

[libraries]
# Spring Boot starters (versions managed by the Spring Boot BOM / dependency-management plugin)
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# PostgreSQL DataSource + JPA (Kafka / DB base connectivity — design.md §3, §9)
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
# Spring for Apache Kafka (broker connectivity; topic/partition defs are task 2.x)
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
# JSR-380 bean validation for fail-fast @ConfigurationProperties binding
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
# PostgreSQL JDBC driver (runtime)
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# ArchUnit (JUnit 5 integration)
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# JUnit 5
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
