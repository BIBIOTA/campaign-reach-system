# Local development infrastructure for campaign-reach-system.
#
# Spins up the backing services the app needs at runtime — PostgreSQL, Kafka
# (KRaft mode, no ZooKeeper), and Mailpit (local SMTP capture). This is for
# LOCAL DEV ONLY; integration tests use Testcontainers and do NOT use this file.
#
#   docker compose up -d        # start (data persists in named volumes)
#   docker compose down         # stop, keep data
#   docker compose down -v      # stop and wipe data
#
# Host ports are overridable via .env (see .env.example) for machines where the
# defaults are already taken. `restart: unless-stopped` keeps all services up
# across reboots until you explicitly `docker compose down`.

name: campaign-reach-local

services:
  postgres:
    image: postgres:16
    container_name: crs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campaign_reach}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-campaign_reach}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    container_name: crs-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # The app (running on the host) reconnects to whatever is advertised here,
      # so it must match the published host port above.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # 127.0.0.1 (not localhost): the controller listener binds IPv4 0.0.0.0:9093,
      # so forcing IPv4 loopback avoids a failed quorum connection on hosts where
      # localhost resolves to ::1 (IPv6) first.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      # Full path: the kafka CLI scripts live under /opt/kafka/bin and are NOT on
      # PATH in apache/kafka:3.8.0, so a bare script name would always exit 127.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Mailpit captures email the app sends during local smoke tests. It acts as a
  # fake SMTP sink: mail is held in-memory only and NEVER forwarded to real
  # recipients, so it is safe to exercise the email path without spamming anyone.
  #   - SMTP :1025  — the app connects here to "send" mail.
  #   - Web UI :8025 — developers open http://localhost:8025 to view captured mail.
  # No named volume on purpose: captured mail is ephemeral and need not survive a
  # restart, which keeps the smoke-test sink simple and disposable.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: crs-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      # The mailpit image ships with wget; /readyz on the UI port reports ready.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8025/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  kafkadata:
