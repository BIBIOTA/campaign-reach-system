# Base infrastructure configuration for the campaign-reach modular monolith.
#
# All sensitive / environment-specific values are injected from environment
# variables or a secret manager (vault) via ${...} placeholders. This file MUST
# NOT contain real secrets (design.md §10). The Email provider API key has no
# default and must be supplied via EMAIL_PROVIDER_API_KEY.

spring:
  application:
    name: campaign-reach-system

  # PostgreSQL DataSource (design.md §3, §9). URL has no real default so a
  # missing value fails fast rather than silently using an embedded DB.
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations (task 3+), not by Hibernate auto-DDL.
      ddl-auto: none
    open-in-view: false

  # Flyway owns the schema: migrations under classpath:db/migration run on startup
  # (task 3.1 onward). Baseline-on-migrate lets it adopt a pre-existing empty DB.
  flyway:
    enabled: true
    baseline-on-migrate: true

  # Kafka broker connectivity (design.md §9). Topics, partition keys and
  # consumer groups are defined by later tasks (2.x), not here.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}

# Email provider secret — supplied from environment / vault, never committed.
campaignreach:
  email-provider:
    api-key: ${EMAIL_PROVIDER_API_KEY:}

  # Back-office operator accounts for the internal campaign REST (task 4.1, §10).
  # Username/password come from env/vault; the per-operator UUID is deterministic so
  # audit columns (created_by/updated_by) are stable. Never commit real credentials.
  security:
    operators:
      - username: ${OPERATOR_USERNAME:}
        password: ${OPERATOR_PASSWORD:}
        id: ${OPERATOR_ID:}
