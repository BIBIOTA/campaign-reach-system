# Base infrastructure configuration for the campaign-reach modular monolith.
#
# All sensitive / environment-specific values are injected from environment
# variables or a secret manager (vault) via ${...} placeholders. This file MUST
# NOT contain real secrets (design.md §10). The Email provider API key has no
# default and must be supplied via EMAIL_PROVIDER_API_KEY.

spring:
  application:
    name: campaign-reach-system

  # PostgreSQL DataSource (design.md §3, §9). URL has no real default so a
  # missing value fails fast rather than silently using an embedded DB.
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations (task 3+), not by Hibernate auto-DDL.
      ddl-auto: none
    open-in-view: false

  # Flyway owns the schema: migrations under classpath:db/migration run on startup
  # (task 3.1 onward). Baseline-on-migrate lets it adopt a pre-existing empty DB.
  flyway:
    enabled: true
    baseline-on-migrate: true

  # Kafka broker connectivity (design.md §9). Topics, partition keys and
  # consumer groups are defined by later tasks (2.x), not here.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    # Producer side (task 6.2): the campaign reach-scan publishes activity-level
    # ReachRequested events. String partition key + JSON value payload.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    # Consumer side (task 6.3, path 2): the campaign-trigger group consumes behavior events
    # from domain.events. String key + JSON value deserialized to the inbound DomainBehaviorEvent.
    # The JSON deserializer is wrapped in ErrorHandlingDeserializer so a malformed payload becomes a
    # recoverable failed record (routed to domain.events.DLT by the error handler) instead of blocking
    # the partition in an infinite deserialization loop. The trusted-packages allowlist restricts JSON
    # deserialization to the campaign consumer package.
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.example.campaignreach.campaign.consumer.DomainBehaviorEvent
        spring.json.trusted.packages: com.example.campaignreach.campaign.consumer

# Email provider secret — supplied from environment / vault, never committed.
campaignreach:
  # At-least-once consumer policy (design.md §9): opt the campaign-trigger consumer (task 6.3) into
  # the shared kernel's gated manual-ack container factory so offsets commit only after a behavior
  # event has been processed (its ReachRequested handed off to the publisher).
  kafka:
    at-least-once:
      enabled: true
    # Bounded wait for the broker ack when publishing ReachRequested (task 6.2/6.3). Caps how long a
    # slow broker can block the scan/consumer thread; on timeout the send fails and propagates so the
    # event path declines the ack and Kafka re-delivers (at-least-once).
    publish-timeout: 10s

  # Reach audience fan-out (task 7.3, spec §5). Two independent knobs:
  reach:
    expansion:
      # Recipients resolved-and-inserted per committed page during fan-out. Smaller pages commit
      # progress more often (finer crash-resume granularity); larger pages batch harder. Throughput
      # / resume-granularity lever only — correctness comes from the four-column unique constraint.
      page-size: 1000
    frequency-cap:
      # Frequency-cap lookback window (Duration). Before inserting a recipient's ReachTask, the
      # expander skips the user if they already have a reach_task in a DIFFERENT send_cycle within
      # this window — over-reach guard, separate from the same-cycle unique-constraint idempotency.
      window: PT24H

  email-provider:
    api-key: ${EMAIL_PROVIDER_API_KEY:}

  # Back-office operator accounts for the internal campaign REST (task 4.1, §10).
  # Username/password come from env/vault; the per-operator UUID is deterministic so
  # audit columns (created_by/updated_by) are stable. Never commit real credentials.
  security:
    operators:
      - username: ${OPERATOR_USERNAME:}
        password: ${OPERATOR_PASSWORD:}
        id: ${OPERATOR_ID:}
